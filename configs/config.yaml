data:
  raw_path: data/raw/synthetic_finance_20250901.csv
  interim_path: data/interim/customers.parquet

project:
  seed: 42

sample_data:
  output_path: tests/data/sample.csv
  rows: 50

data_quality:
  config_path: configs/data_quality.yaml
  report_path: reports/data_quality_report.html
  income_bins: [0, 50000, 100000, 150000]

splits:
  train_size: 0.70
  valid_size: 0.15
  test_size: 0.15
  stratify_column: credit_risk
  id_paths:
    train: data/processed/train_ids.npy
    valid: data/processed/valid_ids.npy
    test: data/processed/test_ids.npy

features:
  reference_date: 2025-01-01
  age_bins: [0, 25, 35, 45, 55, 65, .inf]
  income_bins: [0, 50000, 100000, 150000, 250000, .inf]
  skew_threshold: 1.0
  exclude: []
  education_order: [High School, Some College, Bachelor, Master, PhD]
  # Set false to regenerate the baseline feature matrix without these four candidates.
  credit_risk_experiment:
    enabled: false
  output_dir: data/features
  preprocessor_path: data/features/preprocessor.joblib
  train_target_correlation_path: data/features/train_target_correlations.parquet

models:
  credit_config_path: configs/model_credit.yaml
  fraud_config_path: configs/model_fraud.yaml

baselines:
  summary_report_path: reports/baseline_summary.html

training:
  segment_columns: [employment_status, age_bin, income_bin]
  max_mlflow_artifact_bytes: 52428800

governance:
  credit_high_risk_class: 2
  threshold_candidate_quantiles: 201
  shap_sample_size: 10000
  shap_waterfall_cases: 3
  sensitive_columns: [age_bin, marital_status, region, education_level]
  no_sensitive_exclude: [age, age_bin, marital_status]
  reports:
    thresholds: reports/threshold_report.html
    fairness: reports/fairness_report.html
    credit_shap: reports/credit_shap_report.html
    fraud_shap: reports/fraud_shap_report.html

inference:
  input_path: data/raw/synthetic_finance_20250901.csv
  output_path: data/predictions/batch_predictions.csv
  model_version: v1.0.0

eda:
  # null analyzes every raw row; set an integer to use a reproducible sample instead.
  sample_size: null
  report_path: reports/eda_report.html

targets:
  classification: credit_risk
  regression: fraud_risk_score
