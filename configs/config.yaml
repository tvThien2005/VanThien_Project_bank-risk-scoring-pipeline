data:
  raw_path: data/raw/synthetic_finance_20250901.csv
  interim_path: data/interim/customers.parquet

project:
  seed: 42

sample_data:
  output_path: tests/data/sample.csv
  rows: 50

data_quality:
  config_path: configs/data_quality.yaml
  report_path: reports/data_quality_report.html
  income_bins: [0, 50000, 100000, 150000]

splits:
  train_size: 0.70
  valid_size: 0.15
  test_size: 0.15
  stratify_column: credit_risk
  id_paths:
    train: data/processed/train_ids.npy
    valid: data/processed/valid_ids.npy
    test: data/processed/test_ids.npy

features:
  reference_date: 2025-01-01
  age_bins: [0, 25, 35, 45, 55, 65, .inf]
  income_bins: [0, 50000, 100000, 150000, 250000, .inf]
  skew_threshold: 1.0
  exclude: []
  education_order: [High School, Some College, Bachelor, Master, PhD]
  output_dir: data/features
  preprocessor_path: data/features/preprocessor.joblib
  train_target_correlation_path: data/features/train_target_correlations.parquet

models:
  credit_config_path: configs/model_credit.yaml
  fraud_config_path: configs/model_fraud.yaml

baselines:
  summary_report_path: reports/baseline_summary.html

targets:
  classification: credit_risk
  regression: fraud_risk_score
